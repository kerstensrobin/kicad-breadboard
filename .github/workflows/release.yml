name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIP
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ZIP_NAME="kicad-breadboard-${VERSION}.zip"
          zip -r "$ZIP_NAME" plugins/
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum $ZIP_NAME | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body: |
            ## Installation via KiCad PCM
            Open KiCad → Plugin and Content Manager → install from ZIP, or wait for the official addon repository to pick up the update.

            **SHA-256:** `${{ env.SHA256 }}`
